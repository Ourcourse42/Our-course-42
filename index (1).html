<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our course 42</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6efe3;--card:#fffaf0;--ink:#2d2a26;--mut:#7a6f62;--ac:#c2562e;--ac2:#f0d9c4;--ok:#2f7d4f;--bad:#b3312d;--line:#e4d6c0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=ocean]{--bg:#e8f1f5;--card:#fff;--ink:#16303d;--mut:#5d7886;--ac:#1d7a9c;--ac2:#cfe6ef;--line:#cfdfe6}
:root[data-theme=forest]{--bg:#e9efe4;--card:#fbfdf8;--ink:#23301f;--mut:#667a5f;--ac:#3f7d3a;--ac2:#d3e5cc;--line:#d2dec9}
:root[data-theme=rose]{--bg:#f8e9ec;--card:#fff9fa;--ink:#3a2229;--mut:#85616b;--ac:#b83a5a;--ac2:#f3d3da;--line:#ecd0d6}
:root[data-theme=night]{--bg:#1b1a22;--card:#26242f;--ink:#efeaf5;--mut:#a39cb3;--ac:#e0a458;--ac2:#3a3646;--line:#3a3646;--ok:#6cc58d;--bad:#ff8a80}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.55}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0 0 .4em}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.6rem;cursor:pointer}
.logo span{color:var(--ac)}
a.lnk,.lnk{color:var(--mut);cursor:pointer;font-size:.9rem;text-decoration:underline;background:none;border:0;font:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.tabs{display:flex;gap:8px;margin:14px 0}
.tab{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.subj{display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:transform .15s}
.subj:hover{transform:translateX(4px);border-color:var(--ac)}
.pill{background:var(--ac2);color:var(--ink);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:var(--ac2);color:var(--ink)}.btn.red{background:var(--bad)}.btn.sm{padding:5px 10px;font-size:.85rem}
.mini{display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:var(--ac);color:#fff;border-radius:16px;padding:14px 18px}
.mini b{font-family:Fraunces,Georgia,serif;font-size:1.5rem}
.big{text-align:center;padding:24px 8px}
.units{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:76px}
.unit b{display:block;font-family:Fraunces,Georgia,serif;font-size:2rem;color:var(--ac)}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.sel{border-color:var(--ac);background:var(--ac2)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.timer{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;font-weight:700;display:flex;justify-content:space-between;z-index:2}
input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin:3px 0}
textarea{min-height:60px}
.row{display:flex;gap:8px;align-items:center}.row input[type=radio]{width:auto}
.mut{color:var(--mut);font-size:.9rem}.score{font-family:Fraunces,Georgia,serif;font-size:3rem;color:var(--ac)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.hero{padding:22px 4px 6px}.hero h1{font-size:2rem;margin:0}.hero p{margin:4px 0 0;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:.78rem;color:var(--mut)}
.stat b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.4rem;color:var(--ac)}
.bar{height:8px;background:var(--ac2);border-radius:9px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--ac)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:10px 0}
.nav button{padding:7px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.nav .a{background:var(--ac2)}.nav .f{border-color:var(--bad);color:var(--bad)}.nav .c{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.grid .card{margin:0}
.sc{cursor:pointer;transition:transform .15s,border-color .15s}.sc:hover{transform:translateY(-3px);border-color:var(--ac)}
.ico{width:42px;height:42px;border-radius:12px;background:var(--ac);color:#fff;display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.3rem;margin-bottom:8px}
.vid{display:block;padding:0;overflow:hidden;color:var(--ink);text-decoration:none;transition:transform .15s}.vid:hover{transform:translateY(-3px)}
.th,.ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.ph{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-size:2.2rem}
.vt{padding:10px 12px}.vt b{display:block}
.cc{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:65vh}
.cc>*{width:100%;max-width:560px}.cc .units{justify-content:center}
.badge{background:var(--ok);color:#fff;border-radius:99px;padding:2px 9px;font-size:.78rem;font-weight:700}
.expl{margin-top:8px;padding:10px 12px;border-left:4px solid var(--ac);background:var(--ac2);border-radius:6px;font-size:.92rem}
textarea.ag{overflow:hidden;resize:none;min-height:42px;line-height:1.45}
.qc{border-left:4px solid var(--ac)}.opt-r{display:flex;gap:8px;align-items:flex-start;margin:4px 0}.opt-r input[type=radio]{width:auto;margin-top:12px}.opt-r b{margin-top:10px;width:18px}
.fl{display:block;font-weight:700;margin:12px 0 2px;font-size:.92rem}.pv{max-width:240px;border-radius:10px;overflow:hidden;margin:8px 0}.hint{background:var(--ac2);border-radius:10px;padding:10px 12px;font-size:.92rem;margin:8px 0}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const ADMIN_EMAIL='admin@ourcourse42.com'; // internal login name, never shown or typed
const SUPABASE_URL='https://axikpnfmfwxqqzrwrszy.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4aWtwbmZtZnd4cXF6cndyc3p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NTMxMTYsImV4cCI6MjEwNjUyOTExNn0.490Kk_1PcyeM5_vO_lXkbzj7nN6WaNTKOqc1pxOI1-o';
const sampleQs=[{q:'Which electrolyte abnormality is classically associated with peaked T waves?',o:['Hyperkalemia','Hypokalemia','Hypocalcemia','Hypernatremia'],a:0},{q:'First-line imaging for suspected gallstones?',o:['CT abdomen','Ultrasound','MRI','HIDA scan'],a:1}];
const mk=(n,ex=[])=>({id:uid(),name:n,exams:ex});
let S={theme:'paper',
cd:{title:'The Big Day',date:'2027-10-07',details:'Every page you read and every question you solve brings this day closer.',quotes:['Small steps every day add up to big results.','You are training to hold someone\u2019s life in your hands. Be proud of that.','Rest if you must, but never quit.']},
terms:[{name:'Term 1',subjects:[mk('Internal Medicine 3',[{id:uid(),title:'Sample Exam 1',min:10,qs:sampleQs}]),mk('Surgery 3'),mk('Family Medicine')]},
{name:'Term 2',subjects:[mk('Emergency Medicine'),mk('Surgery 4')]}]};
let dbDoc=null,admin=false,view={},exam=null,timerId=null,qi=0;
let sb=null;
const save=()=>{if(!sb||!admin)return;sb.from('site_state').update({data:JSON.parse(JSON.stringify(S))}).eq('id',1).then(r=>{if(r.error){console.warn(r.error);alert('Save failed: '+r.error.message)}})};
let tt;const saveSoon=()=>{clearTimeout(tt);tt=setTimeout(save,600)};
const find=(ti,si)=>S.terms[ti].subjects[si];

function route(){const h=location.hash.slice(1).split('/');return h}
function go(p){location.hash=p}
window.addEventListener('hashchange',render);

function head(){return `<header><div class="logo" onclick="go('')">Our course <span>42</span></div>
<button class="lnk" onclick="go('admin')">${admin?'Admin dashboard':'Admin'}</button></header>`}

function days(){const t=new Date(S.cd.date+'T00:00:00')-new Date();return t}
function parts(){let t=Math.max(0,days()),s=Math.floor(t/1000);return [Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60]}

function render(){
 clearInterval(timerId);document.documentElement.dataset.theme=S.theme;
 const [p,a,b,c]=route();const A=document.getElementById('app');let h=head();
 if(p==='subject')h+=pSubject(+a,+b);
 else if(p==='exam')h+=pExam(+a,+b,c);
 else if(p==='countdown')h+=pCountdown();
 else if(p==='admin')h+=pAdmin();
 else h+=pHome();
 A.innerHTML=h;document.querySelectorAll('textarea.ag').forEach(ag);
 if(p==='countdown'||!p)timerId=setInterval(tick,1000);
 if(p==='exam'&&exam&&!exam.done)timerId=setInterval(examTick,1000);
}
function tick(){const e=document.getElementById('cdm'),f=document.getElementById('cdf');const [d,h,m,s]=parts();
 if(e)e.textContent=d+' days';
 if(f)f.innerHTML=[['Days',d],['Hours',h],['Minutes',m],['Seconds',s]].map(x=>`<div class="unit"><b>${x[1]}</b>${x[0]}</div>`).join('')}

let homeTerm=0;
function pHome(){
 const q=S.cd.quotes[Math.floor(Date.now()/864e5)%Math.max(1,S.cd.quotes.length)]||'';
 return `<div class="mini" onclick="go('countdown')"><div><div style="opacity:.85;font-size:.85rem">${esc(S.cd.title)}</div><b id="cdm">${parts()[0]} days</b></div><div>See full countdown \u2192</div></div>
 <p class="mut" style="margin:10px 4px">\u201c${esc(q)}\u201d</p>
 <div class="tabs">${S.terms.map((t,i)=>`<button class="tab ${i===homeTerm?'on':''}" onclick="homeTerm=${i};render()">${esc(t.name)}</button>`).join('')}</div>
 ${S.terms[homeTerm].subjects.map((s,i)=>`<div class="card subj" onclick="go('subject/${homeTerm}/${i}')"><div><h3 style="margin:0">${esc(s.name)}</h3><span class="mut">Practice MCQ exams</span></div><span class="pill">${s.exams.length} exam${s.exams.length==1?'':'s'}</span></div>`).join('')}`}

function pCountdown(){const [d,h,m,s]=parts();
 return `<div class="card big"><h2>${esc(S.cd.title)}</h2><div class="mut">${new Date(S.cd.date+'T00:00:00').toDateString()}</div>
 <div class="units" id="cdf">${[['Days',d],['Hours',h],['Minutes',m],['Seconds',s]].map(x=>`<div class="unit"><b>${x[1]}</b>${x[0]}</div>`).join('')}</div>
 <p>${esc(S.cd.details)}</p></div>
 ${S.cd.quotes.map(q=>`<div class="card" style="font-family:Fraunces,Georgia,serif;font-size:1.1rem">\u201c${esc(q)}\u201d</div>`).join('')}
 <button class="btn alt" onclick="go('')">\u2190 Back home</button>`}

function pSubject(ti,si){const s=find(ti,si);
 return `<button class="lnk" onclick="go('')">\u2190 Home</button><h2>${esc(s.name)}</h2>
 ${s.exams.length?s.exams.map(e=>`<div class="card subj" onclick="startExam(${ti},${si},'${e.id}')"><div><h3 style="margin:0">${esc(e.title)}</h3><span class="mut">${e.qs.length} questions \u00b7 ${e.min} min</span></div><span class="btn sm">Start</span></div>`).join(''):'<div class="card mut">No exams here yet. Check back soon.</div>'}`}

function startExam(ti,si,id){const e=find(ti,si).exams.find(x=>x.id===id);
 if(!e.qs.length){alert('This exam has no questions yet.');return}
 exam={ti,si,id,e,ans:{},end:Date.now()+e.min*60000,done:false};go(`exam/${ti}/${si}/${id}`)}
function pExam(ti,si,id){
 if(!exam||exam.id!==id){const e=find(ti,si)?.exams.find(x=>x.id===id);if(!e||(!vis(e)&&!admin))return '<div class="card">Exam not found.</div>';
  exam={ti,si,id,e,ans:{},end:Date.now()+e.min*60000,done:false}}
 const E=exam.e;
 if(exam.done){const wrong=E.qs.filter((q,i)=>exam.ans[i]!==q.a).length,right=E.qs.length-wrong;
  return `<div class="card big"><h2>${esc(E.title)}</h2><div class="score">${right} / ${E.qs.length}</div>
  <p><b style="color:var(--bad)">${wrong}</b> wrong or unanswered \u00b7 <b style="color:var(--ok)">${right}</b> correct</p>
  <button class="btn" onclick="startExam(${ti},${si},'${id}')">Retake</button> <button class="btn alt" onclick="go('subject/${ti}/${si}')">Back to exams</button></div>
  <h3>Review</h3>${E.qs.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<div class="opt ${j===q.a?'ok':(exam.ans[i]===j?'bad':'')}">${esc(o)}${j===q.a?' \u2713':''}${exam.ans[i]===j&&j!==q.a?' \u2717 your answer':''}</div>`).join('')}${exam.ans[i]===undefined?'<div class="mut">Not answered</div>':''}</div>`).join('')}`}
 return `<div class="timer"><span>${esc(E.title)}</span><span id="tm">--:--</span></div>
 ${E.qs.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<button class="opt ${exam.ans[i]===j?'sel':''}" onclick="pick(${i},${j})">${esc(o)}</button>`).join('')}</div>`).join('')}
 <button class="btn" onclick="finish()">Submit exam</button>`}
function pick(i,j){exam.ans[i]=j;const y=scrollY;render();scrollTo(0,y)}
function examTick(){const l=Math.max(0,exam.end-Date.now()),t=document.getElementById('tm');
 if(t)t.textContent=String(Math.floor(l/60000)).padStart(2,'0')+':'+String(Math.floor(l%60000/1000)).padStart(2,'0');
 if(l<=0)finish(true)}
function finish(auto){if(!auto&&Object.keys(exam.ans).length<exam.e.qs.length&&!confirm('Some questions are unanswered. Submit anyway?'))return;exam.done=true;render();scrollTo(0,0)}

/* ADMIN */
let aSel={ti:0,si:0,ex:null};
function pAdmin(){
 if(!admin)return `<div class="card"><h2>Admin login</h2><input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')login()"><button class="btn" onclick="login()">Enter</button></div>`;
 const sub=find(aSel.ti,aSel.si),ex=sub.exams.find(e=>e.id===aSel.ex);
 return `<h2>Admin dashboard</h2>
 <div class="card"><h3>Website style</h3><div class="sw">${['paper','ocean','forest','rose','night'].map(t=>`<button class="btn ${S.theme===t?'':'alt'} sm" onclick="S.theme='${t}';save();render()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>
 <div class="card"><h3>Countdown</h3>
 <label class="mut">Title</label><input value="${esc(S.cd.title)}" oninput="S.cd.title=this.value;saveSoon()">
 <label class="mut">Date</label><input type="date" value="${esc(S.cd.date)}" onchange="S.cd.date=this.value;save()">
 <label class="mut">Details</label><textarea oninput="S.cd.details=this.value;saveSoon()">${esc(S.cd.details)}</textarea>
 <label class="mut">Quotes (one per line)</label><textarea style="min-height:110px" oninput="S.cd.quotes=this.value.split('\\n').filter(x=>x.trim());saveSoon()">${esc(S.cd.quotes.join('\n'))}</textarea></div>
 <div class="card"><h3>Exams</h3>
 <select onchange="const v=this.value.split('-');aSel={ti:+v[0],si:+v[1],ex:null};render()">${S.terms.map((t,ti)=>t.subjects.map((s,si)=>`<option value="${ti}-${si}" ${ti==aSel.ti&&si==aSel.si?'selected':''}>${esc(t.name)} \u2014 ${esc(s.name)}</option>`).join('')).join('')}</select>
 ${sub.exams.map(e=>`<div class="row" style="margin:6px 0"><span style="flex:1">${esc(e.title)} <span class="mut">(${e.qs.length} q)</span> ${e.pub===false?'<span class="pill">Draft</span>':'<span class="badge">Live</span>'}</span><button class="btn alt sm" onclick="go('examedit/${aSel.ti}/${aSel.si}/${e.id}')">Edit questions</button><button class="btn red sm" onclick="delExam('${e.id}')">Delete</button></div>`).join('')||'<p class="mut">No exams yet.</p>'}
 <button class="btn" onclick="addExam()">+ Add exam</button></div>
 
 <button class="lnk" onclick="admin=false;sb&&sb.auth.signOut();go('')">Log out</button>`}
function editor(ex){return `<div class="card"><h3>Editing: ${esc(ex.title)}</h3>
 <label class="mut">Exam title</label><input value="${esc(ex.title)}" oninput="cur().title=this.value;saveSoon()">
 <label class="mut">Time limit (minutes)</label><input type="number" min="1" value="${ex.min}" oninput="cur().min=Math.max(1,+this.value||1);saveSoon()">
 ${ex.qs.map((q,i)=>`<div class="card"><div class="row"><b>Q${i+1}</b><span style="flex:1"></span><button class="btn red sm" onclick="delQ(${i})">Remove</button></div>
 <textarea oninput="cur().qs[${i}].q=this.value;saveSoon()">${esc(q.q)}</textarea>
 ${q.o.map((o,j)=>`<div class="row"><input type="radio" name="r${i}" ${q.a===j?'checked':''} onchange="cur().qs[${i}].a=${j};save()"><input value="${esc(o)}" oninput="cur().qs[${i}].o[${j}]=this.value;saveSoon()"></div>`).join('')}
 <div class="mut">Select the circle next to the correct answer.</div></div>`).join('')}
 <button class="btn alt" onclick="addQ()">+ Add question</button></div>`}
const cur=()=>find(aSel.ti,aSel.si).exams.find(e=>e.id===aSel.ex);
function addExam(){const t=prompt('Exam title?');if(!t)return;const e={id:uid(),title:t,min:30,qs:[],pub:false};find(aSel.ti,aSel.si).exams.push(e);aSel.ex=e.id;save();go('examedit/'+aSel.ti+'/'+aSel.si+'/'+e.id)}
function delExam(id){if(!confirm('Delete this exam?'))return;const s=find(aSel.ti,aSel.si);s.exams=s.exams.filter(e=>e.id!==id);if(aSel.ex===id)aSel.ex=null;save();render()}
function addQ(){cur().qs.push({q:'',o:['','','',''],a:0});save();render()}
function delQ(i){cur().qs.splice(i,1);save();render()}
async function login(){if(!sb){alert('Supabase is not configured yet.');return}const r=await sb.auth.signInWithPassword({email:ADMIN_EMAIL,password:document.getElementById('pw').value});if(r.error)alert('Login failed: '+r.error.message);else{admin=true;render()}}

/* ===== ENRICHMENTS ===== */
const hist=()=>{try{return JSON.parse(localStorage.getItem('oc42')||'{}')}catch(e){return{}}};
const setHist=h=>{try{localStorage.setItem('oc42',JSON.stringify(h))}catch(e){}};
const allEx=()=>S.terms.flatMap((t,ti)=>t.subjects.flatMap((s,si)=>s.exams.filter(vis).map(e=>({e,ti,si,s,t}))));
const _home=pHome;
pHome=function(){
 const A=allEx(),H=hist(),n=Object.keys(H).length,nq=A.reduce((a,x)=>a+x.e.qs.length,0);
 const avg=n?Math.round(Object.values(H).reduce((a,x)=>a+x.pct,0)/n):0;
 const hr=new Date().getHours(),g=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
 return `<div class="hero"><h1>${g}, doctor-to-be.</h1><p>Pick a subject, set the timer, and learn from every mistake.</p></div>
 ${S.ann?`<div class="card" style="border-left:5px solid var(--ac)">\ud83d\udce3 ${esc(S.ann)}</div>`:''}
 <div class="stats"><div class="stat"><b>${A.length}</b>Exams</div><div class="stat"><b>${nq}</b>Questions</div><div class="stat"><b>${n}</b>You took</div><div class="stat"><b>${avg}%</b>Your avg</div></div>
 <input placeholder="\ud83d\udd0d Search exams\u2026" oninput="srch(this.value)"><div id="sr"></div>`+_home()};
function srch(v){v=v.trim().toLowerCase();const H=hist();
 document.getElementById('sr').innerHTML=v?allEx().filter(x=>(x.e.title+x.s.name).toLowerCase().includes(v)).map(x=>`<div class="card subj" onclick="startExam(${x.ti},${x.si},'${x.e.id}')"><div><b>${esc(x.e.title)}</b><div class="mut">${esc(x.s.name)}</div></div><span class="btn sm">Start</span></div>`).join('')||'<p class="mut">Nothing found.</p>':''}
pSubject=function(ti,si){const s0=find(ti,si),H=hist(),s={...s0,exams:V(s0)};
 return `<button class="lnk" onclick="go('')">\u2190 Home</button><h2>${esc(s.name)}</h2>
 ${s.exams.length?`<button class="btn alt" onclick="startMix(${ti},${si})">\ud83c\udfb2 Random mixed quiz (10 questions)</button>`:''}
 ${s.exams.length?s.exams.map(e=>{const h=H[e.id];return `<div class="card subj" onclick="startExam(${ti},${si},'${e.id}')"><div><h3 style="margin:0">${esc(e.title)}</h3><span class="mut">${e.qs.length} questions \u00b7 ${e.min} min${h?` \u00b7 ${h.n} attempt${h.n>1?'s':''}`:''}</span></div>${h?`<span class="badge">Best ${h.best}%</span>`:'<span class="btn sm">Start</span>'}</div>`}).join(''):'<div class="card mut">No exams here yet. Check back soon.</div>'}`};
startExam=function(ti,si,id){const e=find(ti,si).exams.find(x=>x.id===id);
 if(!e.qs.length){alert('This exam has no questions yet.');return}
 exam={ti,si,id,e,ans:{},flag:{},cur:0,filt:'all',end:Date.now()+e.min*60000,done:false};go(`exam/${ti}/${si}/${id}`)};
function startMix(ti,si){const qs=V(find(ti,si)).flatMap(e=>e.qs).filter(q=>q.q).sort(()=>Math.random()-.5).slice(0,10);
 if(!qs.length){alert('No questions yet.');return}
 exam={ti,si,id:'mix'+ti+si,e:{id:'mix'+ti+si,title:'Mixed quiz \u2014 '+find(ti,si).name,min:qs.length*1.5,qs},ans:{},flag:{},cur:0,filt:'all',end:Date.now()+qs.length*90000,done:false};go(`exam/${ti}/${si}/${exam.id}`)}
pExam=function(ti,si,id){
 if(!exam||exam.id!==id){const e=find(ti,si)?.exams.find(x=>x.id===id);if(!e||(!vis(e)&&!admin))return '<div class="card">Exam not found.</div>';
  exam={ti,si,id,e,ans:{},flag:{},cur:0,filt:'all',end:Date.now()+e.min*60000,done:false}}
 const E=exam.e,N=E.qs.length;
 if(exam.done){const W=E.qs.map((q,i)=>exam.ans[i]!==q.a),wrong=W.filter(Boolean).length,right=N-wrong,pct=Math.round(right/N*100);
  const msg=pct>=85?'Outstanding work!':pct>=65?'Solid. A little more polish.':pct>=50?'You are getting there. Review below.':'Tough one. Every mistake below is a lesson.';
  return `<div class="card big"><h2>${esc(E.title)}</h2><div class="score">${right} / ${N}</div><div class="bar"><i style="width:${pct}%"></i></div>
  <p><b>${pct}%</b> \u2014 ${msg}</p><p><b style="color:var(--bad)">${wrong}</b> wrong or unanswered \u00b7 <b style="color:var(--ok)">${right}</b> correct</p>
  <button class="btn" onclick="startExam(${ti},${si},'${id}')">Retake</button> <button class="btn alt" onclick="go('subject/${ti}/${si}')">Back to exams</button></div>
  <div class="tabs"><button class="tab ${exam.filt=='all'?'on':''}" onclick="exam.filt='all';render()">All (${N})</button><button class="tab ${exam.filt=='wrong'?'on':''}" onclick="exam.filt='wrong';render()">Wrong only (${wrong})</button></div>
  ${E.qs.map((q,i)=>W[i]||exam.filt=='all'?`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<div class="opt ${j===q.a?'ok':(exam.ans[i]===j?'bad':'')}">${esc(o)}${j===q.a?' \u2713 correct':''}${exam.ans[i]===j&&j!==q.a?' \u2717 your answer':''}</div>`).join('')}${exam.ans[i]===undefined?'<div class="mut">Not answered</div>':''}${q.x?`<div class="expl">\ud83d\udca1 ${esc(q.x)}</div>`:''}</div>`:'').join('')}`}
 const i=exam.cur,q=E.qs[i],an=Object.keys(exam.ans).length;
 return `<div class="timer"><span>${esc(E.title)}</span><span id="tm">--:--</span></div>
 <div class="mut">${an} of ${N} answered</div><div class="bar"><i style="width:${an/N*100}%"></i></div>
 <div class="card"><div class="mut">Question ${i+1} of ${N}</div><h3 style="margin-top:6px">${esc(q.q)}</h3>
 ${q.o.map((o,j)=>`<button class="opt ${exam.ans[i]===j?'sel':''}" onclick="pick(${i},${j})"><b>${'ABCD'[j]}.</b> ${esc(o)}</button>`).join('')}
 <button class="lnk" onclick="exam.flag[${i}]=!exam.flag[${i}];render()">${exam.flag[i]?'\ud83d\udea9 Unflag':'\ud83c\udff3\ufe0f Flag for review'}</button></div>
 <div class="row"><button class="btn alt" ${i?'':'disabled style="opacity:.4"'} onclick="exam.cur--;render()">\u2190 Prev</button><span style="flex:1"></span>
 ${i<N-1?`<button class="btn" onclick="exam.cur++;render()">Next \u2192</button>`:`<button class="btn" onclick="finish()">Submit</button>`}</div>
 <div class="nav">${E.qs.map((_,k)=>`<button class="${k==i?'c':exam.flag[k]?'f':exam.ans[k]!==undefined?'a':''}" onclick="exam.cur=${k};render()">${k+1}</button>`).join('')}</div>
 <button class="btn alt sm" onclick="finish()">Finish &amp; see score</button>`};
pick=function(i,j){exam.ans[i]=j;render()};
finish=function(auto){const N=exam.e.qs.length,left=N-Object.keys(exam.ans).length;
 if(!auto&&left&&!confirm(left+' unanswered. Submit anyway?'))return;
 exam.done=true;const pct=Math.round(exam.e.qs.filter((q,i)=>exam.ans[i]===q.a).length/N*100),H=hist(),h=H[exam.e.id]||{n:0,best:0};
 H[exam.e.id]={n:h.n+1,best:Math.max(h.best,pct),pct};setHist(H);render();scrollTo(0,0)};
editor=function(ex){return `<div class="card"><h3>Editing: ${esc(ex.title)}</h3>
 <label class="mut">Exam title</label><input value="${esc(ex.title)}" oninput="cur().title=this.value;saveSoon()">
 <label class="mut">Time limit (minutes)</label><input type="number" min="1" value="${ex.min}" oninput="cur().min=Math.max(1,+this.value||1);saveSoon()">
 ${ex.qs.map((q,i)=>`<div class="card"><div class="row"><b>Q${i+1}</b><span style="flex:1"></span><button class="btn red sm" onclick="delQ(${i})">Remove</button></div>
 <textarea oninput="cur().qs[${i}].q=this.value;saveSoon()">${esc(q.q)}</textarea>
 ${q.o.map((o,j)=>`<div class="row"><input type="radio" name="r${i}" ${q.a===j?'checked':''} onchange="cur().qs[${i}].a=${j};save()"><input value="${esc(o)}" oninput="cur().qs[${i}].o[${j}]=this.value;saveSoon()"></div>`).join('')}
 <div class="mut">Select the circle next to the correct answer.</div>
 <label class="mut">Explanation (shown after the exam)</label><textarea oninput="cur().qs[${i}].x=this.value;saveSoon()">${esc(q.x||'')}</textarea></div>`).join('')}
 <button class="btn alt" onclick="addQ()">+ Add question</button></div>
 <div class="card"><h3>Bulk import</h3><p class="mut">One question per line: Question | A | B | C | D | correct letter | explanation (optional)</p>
 <textarea id="bulk" style="min-height:120px"></textarea><button class="btn" onclick="bulk()">Import into this exam</button></div>`};
function bulk(){const L=document.getElementById('bulk').value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(p=>p.length>=6&&p[0]);
 L.forEach(p=>cur().qs.push({q:p[0],o:p.slice(1,5),a:Math.max(0,'ABCD'.indexOf(p[5].toUpperCase())),x:p[6]||''}));
 alert(L.length+' question(s) imported');save();render()}
const _adm=pAdmin;

 const t=S.terms[aSel.ti];

 <div class="card"><h3>Terms</h3>
 <select onchange="aSel={ti:+this.value,si:0,ex:null};lSel={ti:+this.value,si:0};render()">${S.terms.map((x,i)=>`<option value="${i}" ${i==aSel.ti?'selected':''}>${esc(x.name)}</option>`).join('')}</select>

 ${t.subjects.map((s,i)=>`<div class="row" style="margin:5px 0"><input value="${esc(s.name)}" oninput="find(${aSel.ti},${i}).name=this.value;saveSoon()"><button class="btn red sm" onclick="delSub(${i})">Delete</button></div>`).join('')}
 <button class="btn alt" onclick="addSub()">+ Add subject</button></div>`;
 return h.replace('<button class="lnk" onclick="admin=false',extra+'<button class="lnk" onclick="admin=false')};
function addSub(){const n=prompt('Subject name?');if(!n)return;S.terms[aSel.ti].subjects.push(mk(n));save();render()}
function delSub(i){if(S.terms[aSel.ti].subjects.length<2||!confirm('Delete this subject and all its exams?'))return;S.terms[aSel.ti].subjects.splice(i,1);aSel={ti:aSel.ti,si:0,ex:null};save();render()}

 S.terms.splice(aSel.ti,1);aSel={ti:0,si:0,ex:null};lSel={ti:0,si:0};homeTerm=0;save();render()}

 const A=allEx(),H=hist(),n=Object.keys(H).length,nq=A.reduce((a,x)=>a+x.e.qs.length,0);

 ${S.terms.map((t,ti)=>`<h2 style="margin-top:22px">${esc(t.name)}</h2><div class="grid">${t.subjects.map((s,si)=>`<div class="card sc" onclick="go('subject/${ti}/${si}')"><div class="ico">${esc(s.name[0])}</div><h3>${esc(s.name)}</h3><span class="pill">${V(s).length} exam${V(s).length==1?'':'s'}</span><div class="mut" style="margin-top:6px">${V(s).reduce((a,e)=>a+e.qs.length,0)} questions</div></div>`).join('')}</div>`).join('')}
 <div class="card subj" style="margin-top:20px" onclick="go('courses')"><div><h3 style="margin:0">\ud83c\udf93 Courses &amp; lectures</h3><span class="mut">Video lectures for every subject</span></div><span class="btn sm">Open</span></div>`};

 ${S.terms.map((t,ti)=>`<h3 style="margin-top:18px">${esc(t.name)}</h3><div class="grid">${t.subjects.map((s,si)=>`<div class="card sc" onclick="go('courses/${ti}/${si}')"><div class="ico">${esc(s.name[0])}</div><h3>${esc(s.name)}</h3><span class="pill">${lecs(s.id).length} lecture${lecs(s.id).length==1?'':'s'}</span></div>`).join('')}</div>`).join('')}`}
